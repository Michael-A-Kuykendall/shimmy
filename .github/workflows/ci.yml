name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --release --locked --no-default-features --features fast
    - name: Test
      run: cargo test --release --locked --no-default-features --features fast -- --test-threads=1

  integration:
    name: Integration (airframe engine) (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy (including default-feature tests)
      run: cargo clippy --release --locked --all-targets -- -D warnings
    - name: Test default Airframe integration (no model or GPU needed)
      run: cargo test --release --locked -- --test-threads=1

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [build, integration]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      run: docker build -f deploy/Dockerfile -t shimmy:ci-test .
    - name: Verify binary exists in image
      run: docker run --rm shimmy:ci-test shimmy --version

