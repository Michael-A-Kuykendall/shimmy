name: Apple Metal Diagnostic
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable release source already built and verified
        required: true
        type: choice
        options: [v2.6.6]
        default: v2.6.6
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    if: github.repository == 'Michael-A-Kuykendall/shimmy'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      PYTHONUTF8: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/metal-target
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - name: Guard native Apple host and immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(git -C source rev-parse HEAD)" = 21c7d28381352e1cafc55e84ba941b48d2b12d3e
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: actions/download-artifact@v4
        with:
          name: shimmy-macos-arm64
          run-id: 42404833070
          github-token: ${{ github.token }}
          path: verified-binary
      - name: Validate diagnostic logic locally on the native host
        shell: bash
        run: |
          set -euo pipefail
          python control/.github/scripts/metal_diagnostic.py --self-test
          cargo fmt --manifest-path control/.github/diagnostics/metal-probe/Cargo.toml -- --check
          cargo clippy --locked --manifest-path control/.github/diagnostics/metal-probe/Cargo.toml -- -D warnings
          cargo build --locked --manifest-path control/.github/diagnostics/metal-probe/Cargo.toml
      - name: Execute real Metal capability and model requests
        shell: bash
        run: |
          set -euo pipefail
          python control/.github/scripts/metal_diagnostic.py \
            --binary verified-binary/shimmy-macos-arm64 \
            --probe "$CARGO_TARGET_DIR/debug/shimmy-metal-diagnostic" \
            --output metal-evidence
          git -C source diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shimmy-metal-diagnostic
          path: metal-evidence/
          if-no-files-found: error
          retention-days: 14
