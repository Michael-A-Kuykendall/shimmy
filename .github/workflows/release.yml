name: Release

on:
  push:
    tags: [v*]

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: shimmy
            artifact: shimmy-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: shimmy.exe
            artifact: shimmy-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: shimmy
            artifact: shimmy-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Build
      run: cargo build --release --target ${{ matrix.target }} --features airframe
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-files
    - name: Validate and extract release notes
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        version="${VERSION#v}"
        awk -v version="$version" '
          found && /^## \[/ && index($0, "## [" version "]") != 1 { exit }
          index($0, "## [" version "]") == 1 { found=1 }
          found { print }
        ' CHANGELOG.md > release-notes.md
        test -s release-notes.md || {
          echo "No non-empty CHANGELOG.md section found for ${VERSION}" >&2
          exit 1
        }
    - name: Create release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p dist
        # Preserve the documented artifact name (upload-artifact dir name == final name).
        # Copying by basename alone collides (linux + mac are both "shimmy").
        for d in release-files/*/; do
          [ -d "$d" ] || continue
          for f in "$d"*; do
            [ -f "$f" ] && cp "$f" "dist/$(basename "$d")"
          done
        done
        if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
          gh release edit ${{ github.ref_name }} --notes-file release-notes.md
          gh release upload ${{ github.ref_name }} dist/* --clobber
        else
          gh release create ${{ github.ref_name }} dist/* \
            --title "Shimmy ${{ github.ref_name }}" \
            --notes-file release-notes.md
        fi
