name: Bounded Llama Metal Stall Diagnostic
on:
  workflow_dispatch:
    inputs:
      stage:
        description: One minimal original Llama prefill only
        required: true
        default: llama-stall
        type: choice
        options: [llama-stall]
permissions:
  contents: read
concurrency:
  group: apple-metal-certification
  cancel-in-progress: false
jobs:
  metal:
    if: github.repository == 'Michael-A-Kuykendall/shimmy'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CERT_ENGINE_SHA: e7b5bdb8c6f700d37dbff4a710c9f39ffd6604b9
      CERT_ENGINE_TREE: d58dcac1a4187318c9a388e97492bd5ee35bf997
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify watchdog and frozen fixtures
        run: |
          test "$(uname -m)" = arm64
          python3 .github/certification/llama_stall.py --self-test
          python3 .github/certification/verify.py --self-test
          mkdir -p cert-work/result
          system_profiler SPHardwareDataType SPDisplaysDataType SPSoftwareDataType -json > cert-work/result/system-profiler.json
          vm_stat > cert-work/result/memory-before.txt
          rustc --version --verbose > cert-work/result/rustc.txt
      - uses: actions/checkout@v5
        with:
          repository: Michael-A-Kuykendall/airframe
          ref: 366c8aa429116cf305e04c9dde182a842040b4b1
          path: cert-work/engine
          persist-credentials: false
      - name: Reconstruct exact diagnostic source
        run: |
          git -C cert-work/engine apply --check "$GITHUB_WORKSPACE/.github/certification/llama-boundaries.patch"
          git -C cert-work/engine apply --index "$GITHUB_WORKSPACE/.github/certification/llama-boundaries.patch"
          test "$(git -C cert-work/engine write-tree)" = "$CERT_ENGINE_TREE"
          printf '%s\n' "$CERT_ENGINE_SHA" "$CERT_ENGINE_TREE" > cert-work/result/engine-source.txt
          cp .github/certification/probes/diagnostic.Cargo.lock .github/certification/probes/Cargo.lock
      - name: Compile and check exact diagnostic
        timeout-minutes: 20
        run: |
          cargo build --release --locked --manifest-path .github/certification/probes/Cargo.toml --bin generation --bin metal --config "patch.crates-io.airframe.path=\"$GITHUB_WORKSPACE/cert-work/engine\""
          cargo clippy --locked --manifest-path .github/certification/probes/Cargo.toml --bin generation --bin metal --config "patch.crates-io.airframe.path=\"$GITHUB_WORKSPACE/cert-work/engine\"" -- -D warnings
          shasum -a 256 .github/certification/probes/target/release/{generation,metal} > cert-work/result/probe-SHA256SUMS
          cp .github/certification/probes/Cargo.lock cert-work/result/probe-Cargo.lock
      - name: Actual Metal compute
        timeout-minutes: 2
        env:
          WGPU_BACKEND: metal
        run: .github/certification/probes/target/release/metal > cert-work/result/compute.json
      - name: One original Llama prefill with operation deadlines
        timeout-minutes: 12
        run: python3 .github/certification/llama_stall.py
      - name: Preserve resource state
        if: always()
        run: |
          mkdir -p cert-work/result
          vm_stat > cert-work/result/memory-after.txt
          ps -axo pid,ppid,pgid,stat,etime,comm > cert-work/result/processes-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-llama-stall-diagnostic
          path: cert-work/result/
          if-no-files-found: error
          retention-days: 7
