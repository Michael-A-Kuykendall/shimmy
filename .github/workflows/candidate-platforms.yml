name: Metal 8K Memory Flight Recorder
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-metal-certification
  cancel-in-progress: false
jobs:
  metal:
    if: github.repository == 'Michael-A-Kuykendall/shimmy'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CERT_ENGINE_SHA: 70e8ff52ba3ee401e8a10a0c995c8202d76634b1
      CERT_ENGINE_TREE: 7925363153fc18ff31318b2044d7e3316eaf6d54
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify bounded diagnostic and native identity
        run: |
          test "$(uname -m)" = arm64
          mkdir -p cert-work/result
          python3 .github/certification/flight_run.py --self-test
          python3 .github/certification/verify_flight.py
          system_profiler SPHardwareDataType SPDisplaysDataType SPSoftwareDataType -json > cert-work/result/hardware.json
          vm_stat > cert-work/result/memory-before.txt
          rustc --version --verbose > cert-work/result/rustc.txt
      - uses: actions/checkout@v5
        with:
          repository: Michael-A-Kuykendall/airframe
          ref: 366c8aa429116cf305e04c9dde182a842040b4b1
          path: cert-work/engine
          persist-credentials: false
      - name: Reconstruct frozen engine and official HAL with observation-only patch
        run: |
          echo "064e05aaab7f1753daf90b4a6552da90cb1dde0c7e221a91c8eabf510cc03ba0  .github/certification/flight-engine.patch" | shasum -a 256 -c -
          echo "c88901fc7d985f867d0899a5d81fc48acc9c2dceb4caabcca05ae21b61bf2a79  .github/certification/flight-hal.patch" | shasum -a 256 -c -
          git -C cert-work/engine apply --check "$GITHUB_WORKSPACE/.github/certification/flight-engine.patch"
          git -C cert-work/engine apply --index "$GITHUB_WORKSPACE/.github/certification/flight-engine.patch"
          test "$(git -C cert-work/engine write-tree)" = "$CERT_ENGINE_TREE"
          curl --fail --location --retry 2 https://static.crates.io/crates/wgpu-hal/wgpu-hal-27.0.4.crate -o cert-work/hal.crate
          echo "5b21cb61c57ee198bc4aff71aeadff4cbb80b927beb912506af9c780d64313ce  cert-work/hal.crate" | shasum -a 256 -c -
          mkdir cert-work/hal
          tar -xzf cert-work/hal.crate --strip-components=1 -C cert-work/hal
          git -C cert-work/hal apply --check "$GITHUB_WORKSPACE/.github/certification/flight-hal.patch"
          git -C cert-work/hal apply "$GITHUB_WORKSPACE/.github/certification/flight-hal.patch"
          cmp cert-work/engine/src/diagnostic_flight/core.rs cert-work/hal/src/diagnostic_flight/core.rs
          cp .github/certification/probes/flight.Cargo.lock .github/certification/probes/Cargo.lock
          printf '%s\n' "$CERT_ENGINE_SHA" "$CERT_ENGINE_TREE" > cert-work/result/source.txt
      - name: Build original probe with unchanged dependency versions and kernels
        timeout-minutes: 20
        run: |
          cargo build --release --locked --manifest-path .github/certification/probes/Cargo.toml --bin dense --bin metal --config "patch.crates-io.airframe.path=\"$GITHUB_WORKSPACE/cert-work/engine\"" --config "patch.crates-io.wgpu-hal.path=\"$GITHUB_WORKSPACE/cert-work/hal\""
          shasum -a 256 .github/certification/probes/target/release/{dense,metal} > cert-work/result/binaries-SHA256SUMS
          cp .github/certification/probes/Cargo.lock cert-work/result/Cargo.lock
      - name: One original-state prefix diagnostic, no hot-path logging
        timeout-minutes: 95
        run: |
          WGPU_BACKEND=metal .github/certification/probes/target/release/metal > cert-work/result/compute.json
          python3 .github/certification/flight_run.py
      - name: Preserve final memory and diagnostic classification
        if: always()
        run: |
          mkdir -p cert-work/result
          vm_stat > cert-work/result/memory-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-metal-8k-flight
          path: cert-work/result/
          if-no-files-found: error
          retention-days: 7
