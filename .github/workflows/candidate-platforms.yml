name: Qwen8K Metal Boundary Diagnostic
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Original Qwen8K input, stop after first blocked boundary
        required: true
        default: qwen8k-boundary
        type: choice
        options: [qwen8k-boundary]
permissions:
  contents: read
concurrency:
  group: apple-metal-certification
  cancel-in-progress: false
jobs:
  metal:
    if: github.repository == 'Michael-A-Kuykendall/shimmy'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CERT_ENGINE_SHA: cd497aee69946f24d1e53f0efafd948f7034ed2d
      CERT_ENGINE_TREE: 8835dd12af5a16bc6f14ff9455e24be7d407ef82
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify watchdog and frozen fixtures
        run: |
          test "$(uname -m)" = arm64
          python3 .github/certification/qwen8k_boundary.py --self-test
          python3 .github/certification/verify.py --self-test
          python3 .github/certification/verify_metal_status_lock.py --self-test
          mkdir -p cert-work/result
          system_profiler SPHardwareDataType SPDisplaysDataType SPSoftwareDataType -json > cert-work/result/system-profiler.json
          vm_stat > cert-work/result/memory-before.txt
          rustc --version --verbose > cert-work/result/rustc.txt
      - uses: actions/checkout@v5
        with:
          repository: Michael-A-Kuykendall/airframe
          ref: 366c8aa429116cf305e04c9dde182a842040b4b1
          path: cert-work/engine
          persist-credentials: false
      - name: Reconstruct exact diagnostic source
        run: |
          git -C cert-work/engine apply --check "$GITHUB_WORKSPACE/.github/certification/llama-boundaries.patch"
          git -C cert-work/engine apply --index "$GITHUB_WORKSPACE/.github/certification/llama-boundaries.patch"
          test "$(git -C cert-work/engine write-tree)" = "$CERT_ENGINE_TREE"
          printf '%s\n' "$CERT_ENGINE_SHA" "$CERT_ENGINE_TREE" > cert-work/result/engine-source.txt
          curl --fail --location https://static.crates.io/crates/wgpu-hal/wgpu-hal-27.0.4.crate --output cert-work/hal.crate
          echo '5b21cb61c57ee198bc4aff71aeadff4cbb80b927beb912506af9c780d64313ce  cert-work/hal.crate' | shasum -a 256 --check
          tar -xzf cert-work/hal.crate -C cert-work
          git -C cert-work/wgpu-hal-27.0.4 init
          echo '5ff22c78a8ef905a2c265818bdb63e522ec6622becc20f1eee01adf8f0a6f77f  cert-work/wgpu-hal-27.0.4/src/metal/device.rs' | shasum -a 256 --check
          echo '82d7e8b96ba04fab5b42722574e9f081def9e50c92dcc7d554d8111b9d0aa2a1  cert-work/wgpu-hal-27.0.4/src/metal/mod.rs' | shasum -a 256 --check
          git -C cert-work/wgpu-hal-27.0.4 apply --check "$GITHUB_WORKSPACE/.github/certification/metal-wait-status.patch"
          git -C cert-work/wgpu-hal-27.0.4 apply "$GITHUB_WORKSPACE/.github/certification/metal-wait-status.patch"
          echo 'c886a515dec58c7b9d3fcc63ee60111dd644b1c179d1adad3b09e10230384841  cert-work/wgpu-hal-27.0.4/src/metal/device.rs' | shasum -a 256 --check
          echo '661c7ec4f4db908e7f5a93d54fe4c5df53bfb8c551a30c84505122bd515fef57  cert-work/wgpu-hal-27.0.4/src/metal/mod.rs' | shasum -a 256 --check
          shasum -a 256 cert-work/hal.crate cert-work/wgpu-hal-27.0.4/src/metal/device.rs cert-work/wgpu-hal-27.0.4/src/metal/mod.rs > cert-work/result/hal-source-SHA256SUMS
          cp .github/certification/probes/metal-status.Cargo.lock .github/certification/probes/Cargo.lock
          python3 .github/certification/verify_metal_status_lock.py --candidate .github/certification/probes/Cargo.lock
      - name: Compile and check exact diagnostic
        timeout-minutes: 20
        run: |
          cargo build --release --locked --manifest-path .github/certification/probes/Cargo.toml --bin dense --bin metal --config "patch.crates-io.airframe.path=\"$GITHUB_WORKSPACE/cert-work/engine\"" --config "patch.crates-io.wgpu-hal.path=\"$GITHUB_WORKSPACE/cert-work/wgpu-hal-27.0.4\""
          cargo clippy --locked --manifest-path .github/certification/probes/Cargo.toml --bin dense --bin metal --config "patch.crates-io.airframe.path=\"$GITHUB_WORKSPACE/cert-work/engine\"" --config "patch.crates-io.wgpu-hal.path=\"$GITHUB_WORKSPACE/cert-work/wgpu-hal-27.0.4\"" -- -D warnings
          shasum -a 256 .github/certification/probes/target/release/{dense,metal} > cert-work/result/probe-SHA256SUMS
          cp .github/certification/probes/Cargo.lock cert-work/result/probe-Cargo.lock
      - name: Actual Metal compute
        timeout-minutes: 2
        env:
          WGPU_BACKEND: metal
        run: .github/certification/probes/target/release/metal > cert-work/result/compute.json
      - name: Original Qwen8K first blocked prefix with raw Metal errors
        timeout-minutes: 92
        run: python3 .github/certification/qwen8k_boundary.py --output cert-work/result/qwen8k-boundary
      - name: Preserve resource state
        if: always()
        run: |
          mkdir -p cert-work/result
          vm_stat > cert-work/result/memory-after.txt
          ps -axo pid,ppid,pgid,stat,etime,comm > cert-work/result/processes-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-qwen8k-boundary
          path: cert-work/result/
          if-no-files-found: error
          retention-days: 7
