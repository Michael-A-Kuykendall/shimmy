name: Docker Publish
on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish only versioned 2.6.6 after BOTH native gates pass; never latest
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: versioned-container-2.6.6
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Michael-A-Kuykendall/shimmy'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare immutable licensed release binary
        run: python3 .github/scripts/container_distribution.py prepare --arch ${{ matrix.arch }} --context build-context
      - name: Build native image without Cargo
        run: docker build -f deploy/Dockerfile -t shimmy:2.6.6-${{ matrix.arch }} build-context
      - name: Download exact startup catalog fixture
        run: curl --fail --location --retry 2 --output Qwen3-0.6B-Q4_K_M.gguf https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/50968a4468ef4233ed78cd7c3de230dd1d61a56b/Qwen3-0.6B-Q4_K_M.gguf
      - name: Native version architecture licensing and authentication gate
        run: python3 .github/scripts/container_distribution.py test --arch ${{ matrix.arch }} --image shimmy:2.6.6-${{ matrix.arch }} --model Qwen3-0.6B-Q4_K_M.gguf --output results/${{ matrix.arch }}.json
      - name: Save exact tested image
        run: |
          docker save shimmy:2.6.6-${{ matrix.arch }} | gzip -1 > results/image-${{ matrix.arch }}.tar.gz
          sha256sum results/image-${{ matrix.arch }}.tar.gz > results/image-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.arch }}
          path: results/*
          retention-days: 3
  publish:
    if: inputs.publish_images
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: container-*
          merge-multiple: true
          path: results
      - uses: docker/setup-buildx-action@v3
      - name: Publish only tested versioned images and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/michael-a-kuykendall/shimmy
          OLD=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          test "$OLD" = sha256:16e3762b2d18ff57408a83177a44a933ca8771058aa43a5da2c7115dadae9906
          if docker buildx imagetools inspect "$IMAGE:2.6.6" >/dev/null 2>&1; then
            echo 'Version already exists; stop instead of overwriting.' >&2
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for ARCH in amd64 arm64; do
            sha256sum -c "results/image-$ARCH.sha256"
            docker load -i "results/image-$ARCH.tar.gz"
            docker tag "shimmy:2.6.6-$ARCH" "$IMAGE:2.6.6-$ARCH"
            docker push "$IMAGE:2.6.6-$ARCH"
          done
          docker buildx imagetools create --tag "$IMAGE:2.6.6" "$IMAGE:2.6.6-amd64" "$IMAGE:2.6.6-arm64"
          docker buildx imagetools inspect "$IMAGE:2.6.6"
          test "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')" = "$OLD"
