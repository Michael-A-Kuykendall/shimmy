name: Metal Embedding Boundary Investigation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-metal-certification
  cancel-in-progress: false
jobs:
  metal:
    if: github.repository == 'Michael-A-Kuykendall/shimmy'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate observational contract and frozen dependency identities
        run: |
          test "$(uname -m)" = arm64
          python3 .github/certification/investigate.py --self-test
      - uses: actions/checkout@v5
        with:
          repository: Michael-A-Kuykendall/airframe
          ref: 366c8aa429116cf305e04c9dde182a842040b4b1
          path: cert-work/engine
          persist-credentials: false
      - name: Apply only the reviewed dev observation patch
        run: |
          git -C cert-work/engine apply --check "$GITHUB_WORKSPACE/.github/certification/engine-diagnostic.patch"
          git -C cert-work/engine apply --index "$GITHUB_WORKSPACE/.github/certification/engine-diagnostic.patch"
          test "$(git -C cert-work/engine write-tree)" = 704d3c605c565135bc76cc928afc9e2d7311bb5b
      - name: Build exact diagnostic source and lock
        timeout-minutes: 20
        run: |
          cp .github/certification/probes/diagnostic.Cargo.lock .github/certification/probes/Cargo.lock
          cargo build --release --locked --manifest-path .github/certification/probes/Cargo.toml --features diagnostic-boundaries --bin boundaries --bin upload --config "patch.crates-io.airframe.path=\"$GITHUB_WORKSPACE/cert-work/engine\""
          mkdir -p cert-work/boundaries
          shasum -a 256 .github/certification/probes/target/release/boundaries .github/certification/probes/target/release/upload > cert-work/boundaries/probe-SHA256SUMS
          cp .github/certification/probes/Cargo.lock cert-work/boundaries/probe-Cargo.lock
          rustc --version --verbose > cert-work/boundaries/rustc.txt
      - name: Observe actual Metal embedding operands and execution boundaries
        timeout-minutes: 12
        continue-on-error: true
        run: python3 .github/certification/investigate.py
      - name: Isolate constructor size source lifetime and transfer APIs
        if: always()
        timeout-minutes: 12
        run: python3 .github/certification/investigate.py --upload --output cert-work/boundaries/upload
      - name: Require both diagnostic outcomes
        if: always()
        run: |
          python3 -c 'import json,pathlib; p=pathlib.Path("cert-work/boundaries"); assert json.loads((p/"report.json").read_text())["tests"]["boundaries"]["status"]=="PASS"; assert json.loads((p/"upload/report.json").read_text())["tests"]["upload"]["status"]=="PASS"'
      - name: Preserve host memory state
        if: always()
        run: |
          mkdir -p cert-work/boundaries
          vm_stat > cert-work/boundaries/memory-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-metal-boundaries
          path: cert-work/boundaries/
          if-no-files-found: error
          retention-days: 1
